server:
  port: 3004
aliyun:
  oss:
    endpoint: ${ALIYUN_OSS_ENDPOINT:https://oss-cn-beijing.aliyuncs.com}
    bucket: ${ALIYUN_OSS_BUCKET:byte-mall}
    access-key-id: ${ALIYUN_OSS_ACCESS_KEY_ID}
    access-key-secret: ${ALIYUN_OSS_ACCESS_KEY_SECRET}
    public-base-url: ${ALIYUN_OSS_PUBLIC_BASE_URL:https://byte-mall.oss-cn-beijing.aliyuncs.com}
    key-prefix: ${ALIYUN_OSS_KEY_PREFIX:products/}

spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  application:
    name: product-service

  datasource:
    url: jdbc:mysql://${DB_HOST:123.56.201.124}:${DB_PORT:6100}/${DB_DATABASE:byte_mall}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:12341234}