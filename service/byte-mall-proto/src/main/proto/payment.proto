syntax = "proto3";

package com.bytemall.payments;

option java_multiple_files = true;
option java_package = "com.bytemall.payment.proto";

// 库存服务：为购物车等其他服务提供实时库存查询能力。
service PaymentService {
  // 为待支付订单创建支付单并返回收银台参数。
  rpc CreatePayment (CreatePaymentRequest) returns (CreatePaymentResponse);

  // 查询可信支付单状态。
  rpc GetPayment (GetPaymentRequest) returns (GetPaymentResponse);

  // 关闭支付单
  rpc CloseOrder (CloseOrderRequest) returns (CloseOrderResponse);
}

message CloseOrderRequest {
  // 需要关闭支付的业务订单号，由支付服务定位当前的待支付支付单。
  string order_no = 1;
  // 关闭原因：ORDER_CANCELLED、PAYMENT_TIMEOUT 或 RISK_REJECTED。
  string reason = 2;
}

message CloseOrderResponse {
  // 业务订单号。
  string order_no = 1;
  // 实际被关闭的支付单号，幂等重复调用时保持首次结果。
  string pay_no = 2;
  // 关闭后的支付单状态，固定为 CLOSED。
  string status = 3;
  // 首次关闭时间，ISO 8601 格式，幂等重复调用时保持不变。
  string closed_at = 4;
}

message CreatePaymentRequest {
  // 待支付订单号
  string order_no = 1;
  // 支付渠道
  string channel = 2;
}
message CreatePaymentResponse {
  // 支付单号
  string payNo = 1;
  // 业务订单号
  string orderNo = 2;
  // 买家 ID，项目统一序列化为字符串
  string userId = 3;
  // 支付渠道
  string channel = 4;
  // 应付金额，单位分
  uint64 amount = 5;
  // 初始为 PENDING
  string status = 6;
  // 收银台令牌或渠道支付参数，不记录明文日志
  string cashierToken = 7;
  // 支付截止时间
  string expireAt = 8;
  // 支付成功时间，未支付时为空
  string paidAt = 9;
  // 创建时间
  string createdAt = 10;
}

message GetPaymentRequest{
  // 支付单号
  string payNo = 1;
}
message GetPaymentResponse{
  // 支付单号
  string payNo = 1;
  // 业务订单号
  string orderNo = 2;
  // 买家 ID
  string userId = 3;
  // 支付渠道
  string channel = 4;
  // 支付金额，单位分
  uint64 amount = 5;
  // PENDING、SUCCESS、FAILED 或 CLOSED
  string status = 6;
  // 收银台令牌或渠道支付参数，不记录明文日志
  string cashierToken = 7;
  // 支付截止时间
  string expireAt = 8;
  // 支付成功时间，未支付时为空
  string paidAt = 9;
  // 创建时间
  string createdAt = 10;
}
