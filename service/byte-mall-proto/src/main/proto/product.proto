syntax = "proto3";

package com.bytemall.product;

option java_multiple_files = true;
option java_package = "com.bytemall.product.proto";

// 商品服务：为内部服务提供商品与 SKU 的批量查询能力。
service ProductService {
  // 批量查询 SKU 摘要，保留所有商品状态并单独返回不存在的 SKU。
  rpc GetSkuBriefs (GetSkuBriefsRequest) returns (GetSkuBriefsResponse);
  // 批量查询下单所需的 SKU 完整快照（含现价），不按上下架状态过滤。
  rpc GetSkuBatch (GetSkuBatchRequest) returns (GetSkuBatchResponse);
  // 商品变更后获取完整搜索索引读模型；商品不存在返回空document。
  rpc GetIndexDocument (GetIndexDocumentRequest) returns (GetIndexDocumentResponse);
}

message GetIndexDocumentRequest {
  string spu_id = 1;
}

message GetIndexDocumentResponse {
  ProductIndexDocument document = 1;
}

message ProductIndexDocument {
  string spu_id = 1;
  string merchant_id = 2;
  string category_id = 3;
  string brand = 4;
  string cover_image = 5;
  string title = 6;
  string subtitle = 7;
  // 描述HTML去除标签后的纯文本
  string description_text = 8;
  // 启用SKU的最低/最高价，单位分
  int64 min_price = 9;
  int64 max_price = 10;
  int64 sales_count = 11;
  // DRAFT、ON_SALE、OFF_SALE，不做过滤
  string status = 12;
  // ISO 8601 UTC
  string published_at = 13;
  string updated_at = 14;
  int64 version = 15;
}

message GetSkuBatchRequest {
  // 单次支持 1 到 100 个 SKU ID，服务端按首次出现顺序去重。
  repeated string sku_ids = 1;
}

message GetSkuBatchResponse {
  repeated ProductSkuInfo items = 1;
  repeated string missing_sku_ids = 2;
}

message ProductSkuInfo {
  string sku_id = 1;
  string spu_id = 2;
  string merchant_id = 3;
  string title = 4;
  string subtitle = 5;
  string brand = 6;
  string category_id = 7;
  string cover_image = 8;
  // 规格 JSON 对象，如 {"颜色":"黑色"}
  string spec_json = 9;
  // 当前售价，单位分，服务端定价为准
  int64 price = 10;
  // 原价，单位分，可为 0
  int64 original_price = 11;
  bool enabled = 12;
  // DRAFT、ON_SALE、OFF_SALE 等商品原始状态，不在服务端过滤。
  string status = 13;
  int64 version = 14;
}

message GetSkuBriefsRequest {
  // 单次支持 1 到 100 个 SKU ID，服务端按首次出现顺序去重。
  repeated string sku_ids = 1;
}

message GetSkuBriefsResponse {
  repeated SkuBrief items = 1;
  repeated string missing_sku_ids = 2;
}

message SkuBrief {
  string sku_id = 1;
  string spu_id = 2;
  string merchant_id = 3;
  string product_title = 4;
  string product_image = 5;
  string sku_code = 6;
  string spec_json = 7;
  bool enabled = 8;
  // DRAFT、ON_SALE、OFF_SALE 等商品原始状态，不在服务端过滤。
  string status = 9;
  int64 version = 10;
}
