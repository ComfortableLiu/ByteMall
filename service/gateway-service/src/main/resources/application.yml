server:
  # 对外统一入口；业务服务仍使用各自的内部端口。
  port: ${GATEWAY_PORT:3000}

spring:
  application:
    name: gateway-service
  main:
    web-application-type: reactive

  cloud:
    gateway:
      server:
        webflux:
          # 在网关层处理WebFlux预检请求，否则OPTIONS会在路由前被拒绝。
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/api/**]':
                allowed-origins: ${BYTE_MALL_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173}
                allowed-methods: GET,HEAD,POST,PUT,PATCH,DELETE,OPTIONS
                allowed-headers: Authorization,Content-Type,Accept,X-Request-Id,X-Actor-Id,Idempotency-Key
                exposed-headers: X-Request-Id
                allow-credentials: true
                max-age: 3600

          default-filters:
            # 每个去重过滤器只处理一个响应头，RETAIN_FIRST保留首个值。
            - DedupeResponseHeader=Access-Control-Allow-Origin,RETAIN_FIRST
            - DedupeResponseHeader=Access-Control-Allow-Credentials,RETAIN_FIRST
            - DedupeResponseHeader=Access-Control-Allow-Methods,RETAIN_FIRST
            - DedupeResponseHeader=Access-Control-Allow-Headers,RETAIN_FIRST
            - DedupeResponseHeader=Access-Control-Expose-Headers,RETAIN_FIRST

          # 原始请求路径和Authorization等请求头会随请求转发，不做用户身份覆盖。
          routes:
            - id: cart-service
              uri: ${CART_SERVICE_URL:http://127.0.0.1:3001}
              predicates:
                - Path=/api/v1/cart,/api/v1/cart/**

            - id: order-service
              uri: ${ORDER_SERVICE_URL:http://127.0.0.1:3002}
              predicates:
                - Path=/api/v1/orders,/api/v1/orders/**,/api/v1/merchant/orders,/api/v1/merchant/orders/**

            - id: pay-service
              uri: ${PAY_SERVICE_URL:http://127.0.0.1:3003}
              predicates:
                - Path=/api/v1/payments,/api/v1/payments/**,/api/v1/merchant/reconciliations,/api/v1/merchant/reconciliations/**,/api/v1/internal/payment-callbacks/**,/api/v1/internal/mock-payments/**

            - id: product-service
              uri: ${PRODUCT_SERVICE_URL:http://127.0.0.1:3004}
              predicates:
                - Path=/api/v1/products,/api/v1/products/**,/api/v1/categories,/api/v1/categories/**,/api/v1/merchant/products,/api/v1/merchant/products/**

            - id: search-service
              uri: ${SEARCH_SERVICE_URL:http://127.0.0.1:3005}
              predicates:
                - Path=/api/v1/search,/api/v1/search/**

            - id: stock-service
              uri: ${STOCK_SERVICE_URL:http://127.0.0.1:3006}
              predicates:
                - Path=/api/v1/stocks,/api/v1/stocks/**,/api/v1/merchant/stocks,/api/v1/merchant/stocks/**

            - id: user-service
              uri: ${USER_SERVICE_URL:http://127.0.0.1:3007}
              predicates:
                - Path=/api/v1/auth,/api/v1/auth/**,/api/v1/user,/api/v1/user/**,/api/v1/users,/api/v1/users/**,/api/v1/merchants,/api/v1/merchants/**,/api/v1/merchant/shop,/api/v1/merchant/shop/**

          httpclient:
            # 防止下游连接或响应异常时请求无限等待。
            connect-timeout: ${GATEWAY_CONNECT_TIMEOUT_MILLIS:3000}
            response-timeout: ${GATEWAY_RESPONSE_TIMEOUT:30s}

management:
  endpoints:
    web:
      exposure:
        # 默认只公开健康检查，不暴露包含内部地址的网关路由信息。
        include: health
